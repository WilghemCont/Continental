<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro - SocialFunding</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- Tu CSS -->
<link rel="stylesheet" href="./../assets/css/index.css">

</head>

<body class="bg-light">

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card border-0 shadow-lg rounded-4">

<!-- HEADER -->
<div class="text-center text-white p-4 rounded-top-4" style="background: linear-gradient(135deg,#2a7ab5,#3a9e6f);">
  <h3 class="fw-bold mb-1">Crear cuenta</h3>
  <p class="mb-0 small">Únete a SocialFunding</p>
</div>

<div class="mb-4">
  <a href="index.html"
     class="d-inline-flex align-items-center gap-2 px-3 py-2 rounded-pill shadow-sm text-decoration-none fw-semibold text-dark bg-white hover-back">
     
    <i class="fa-solid fa-arrow-left"></i>
    Volver al inicio
  </a>
</div>

<div class="card-body p-4">

<form id="registroForm">

<!-- DOCUMENTO -->
<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label fw-semibold">Tipo de documento</label>
    <select class="form-select" id="tipoDocumento">
      <option value="">Seleccione</option>
      <option value="dni">DNI</option>
      <option value="ce">Carné de extranjería</option>
      <option value="pasaporte">Pasaporte</option>
      <option value="ruc">RUC</option>
    </select>
  </div>

  <div class="col-md-6 mb-3">
    <label class="form-label fw-semibold">Número de documento</label>
    <input type="text" class="form-control" id="numeroDocumento">
  </div>
</div>

<!-- PERSONA -->
<div id="personaFields" class="d-none">

<hr>
<h5 class="fw-bold text-primary mb-3"><i class="fa-solid fa-user me-2"></i>Datos personales</h5>

<div class="row">
  <div class="col-md-6 mb-3">
    <input type="text" class="form-control" placeholder="Nombres">
  </div>
  <div class="col-md-6 mb-3">
    <input type="text" class="form-control" placeholder="Apellidos">
  </div>
</div>

<div class="row">
  <div class="col-md-6 mb-3">
    <input type="date" class="form-control">
  </div>
  <div class="col-md-6 mb-3">
    <select class="form-select">
      <option value="">Sexo</option>
      <option>Masculino</option>
      <option>Femenino</option>
      <option>Otro</option>
    </select>
  </div>
</div>

<div class="mb-3">
  <input type="text" class="form-control" value="Perú">
</div>

<div class="row">
  <div class="col-md-4 mb-3">
    <input type="text" class="form-control" placeholder="Departamento">
  </div>
  <div class="col-md-4 mb-3">
    <input type="text" class="form-control" placeholder="Provincia">
  </div>
  <div class="col-md-4 mb-3">
    <input type="text" class="form-control" placeholder="Distrito">
  </div>
</div>

<div class="mb-3">
  <input type="text" class="form-control" placeholder="Domicilio">
</div>

<div class="row">
  <div class="col-md-4 mb-3">
    <select class="form-select">
      <option value="+51">+51 Perú</option>
      <option value="+1">+1 USA</option>
    </select>
  </div>
  <div class="col-md-8 mb-3">
    <input type="tel" class="form-control" placeholder="Celular">
  </div>
</div>

<div class="mb-3">
  <input type="email" class="form-control" placeholder="Correo electrónico">
</div>

<div class="mb-3">
  <input type="password" class="form-control" id="passwordPersona" placeholder="Contraseña">
</div>

<div class="mb-3">
  <input type="password" class="form-control" id="passwordPersona2" placeholder="Repetir contraseña">
  <div class="text-danger small" id="errorPassPersona"></div>
</div>

</div>

<!-- EMPRESA -->
<div id="empresaFields" class="d-none">

<hr>
<h5 class="fw-bold text-success mb-3"><i class="fa-solid fa-building me-2"></i>Datos de empresa</h5>

<div class="mb-3">
  <input type="text" class="form-control" placeholder="Razón social">
</div>

<div class="mb-3">
  <input type="text" class="form-control" placeholder="Dirección">
</div>

<div class="row">
  <div class="col-md-4 mb-3">
    <input type="text" class="form-control" placeholder="Departamento">
  </div>
  <div class="col-md-4 mb-3">
    <input type="text" class="form-control" placeholder="Provincia">
  </div>
  <div class="col-md-4 mb-3">
    <input type="text" class="form-control" placeholder="Distrito">
  </div>
</div>

<div class="mb-3">
  <input type="tel" class="form-control" placeholder="Teléfono">
</div>

<div class="mb-3">
  <input type="email" class="form-control" placeholder="Correo empresarial">
</div>

<div class="mb-3">
  <input type="password" class="form-control" id="passwordEmpresa" placeholder="Contraseña">
</div>

<div class="mb-3">
  <input type="password" class="form-control" id="passwordEmpresa2" placeholder="Repetir contraseña">
  <div class="text-danger small" id="errorPassEmpresa"></div>
</div>

</div>
<div id="alerta" class="alert d-none" role="alert"></div>
<!-- BOTONES -->
<div class="d-flex justify-content-between mt-4">
  <button type="reset" class="btn btn-outline-secondary rounded-3">Limpiar</button>
  <button type="submit" class="btn btn-primary rounded-3">
    <i class="fa-solid fa-user-plus"></i> Crear cuenta
  </button>
</div>

</form>

</div>
</div>

</div>
</div>
</div>

<!-- JS -->
<script src="./../assets/js/registro.js"></script>

</body>
</html>
