<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar Sesión</title>

<!-- Tu CSS principal -->
<link rel="stylesheet" href="./../assets/css/index.css">

</head>
<body>

<div class="login-container">

    <div class="login-box">
        
        <div class="login-header">
            <h2>INICIA SESIÓN</h2>
        </div>

        <form class="login-form" action="login.php" method="POST" onsubmit="return validarLogin()">
            
            <label>CORREO ELECTRÓNICO</label>
            <input type="email" id="correo" name="correo" required>

            <label>CONTRASEÑA</label>
            <div class="password-box">
                <input type="password" id="password" name="password" required>
                <span onclick="togglePassword()">👁</span>
            </div>

            <button type="submit" class="login-btn">INICIAR SESIÓN</button>

            <p id="error" class="error"></p>

        </form>

    </div>

</div>

<script>
function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

function validarLogin() {
    let correo = document.getElementById("correo").value;
    let pass = document.getElementById("password").value;

    if (correo === "" || pass === "") {
        document.getElementById("error").innerText = "❌ Completa todos los campos";
        return false;
    }

    return true;
}

// Error desde PHP
const params = new URLSearchParams(window.location.search);
if (params.get("error")) {
    document.getElementById("error").innerText = "❌ Correo o contraseña incorrectos";
}
</script>

</body>
</html>
