<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar Sesión</title>

<style>
body {
    font-family: Arial;
    background: #f4f4f4;
}

.login-box {
    width: 350px;
    margin: 100px auto;
    background: white;
    border-radius: 10px;
}

.header {
    background: green;
    color: white;
    text-align: center;
    padding: 15px;
}

form {
    padding: 20px;
}

label {
    font-size: 12px;
    display: block;
    margin-top: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}

.password-box {
    position: relative;
}

.password-box span {
    position: absolute;
    right: 10px;
    top: 10px;
    cursor: pointer;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: green;
    color: white;
    border: none;
}

.error {
    color: red;
    text-align: center;
    margin-top: 10px;
}
</style>

</head>
<body>

<div class="login-box">
    <div class="header">
        <h2>INICIA SESIÓN</h2>
    </div>

    <form action="login.php" method="POST" onsubmit="return validarLogin()">
        
        <label>CORREO ELECTRÓNICO</label>
        <input type="email" id="correo" name="correo" required>

        <label>CONTRASEÑA</label>
        <div class="password-box">
            <input type="password" id="password" name="password" required>
            <span onclick="togglePassword()">👁</span>
        </div>

        <button type="submit">INICIA SESIÓN</button>

        <p id="error" class="error"></p>

    </form>
</div>

<script>
function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

function validarLogin() {
    let correo = document.getElementById("correo").value;
    let pass = document.getElementById("password").value;

    if (correo === "" || pass === "") {
        document.getElementById("error").innerText = "❌ Completa todos los campos";
        return false;
    }

    return true;
}

// Mostrar error si viene de PHP (?error=1)
const params = new URLSearchParams(window.location.search);
if (params.get("error")) {
    document.getElementById("error").innerText = "❌ Correo o contraseña incorrectos";
}
</script>

</body>
</html>
